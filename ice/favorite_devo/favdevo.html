<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Favorite Devotionals</title>
  <link rel="stylesheet" href="styles/styles.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header-image">
        <h1>My Favorite<br>Devotionals</h1>
      </div>
    </header>
    <main>
      <div class="content-box">
        <!-- Add your devotional content here -->
        <table>
          <tr>
            <th>Speaker</th>
            <th>Title</th>
            <th>Location</th>
            <th>Year</th>
          </tr>
          <tr>
            <td>Prophet</td>
            <td>Gospel is Neat</td>
            <td>Mars</td>
            <td>1999</td>
          </tr>
          <tr>
            <td>Jesus</td>
            <td>Talking About the Gospel</td>
            <td>Probably a Church</td>
            <td>20ad</td>
          </tr>
          <tr>
            <td>An Angel</td>
            <td>Jesus and Who He Is</td>
            <td>Earth</td>
            <td>100000</td>
          </tr>
        </table>
        <h2>Submit devotional</h2>
        <form>
          <div class="form-row">
            <label for="speaker">Speaker:</label>
            <input type="text" id="speaker">
          </div>
          <div class="form-row">
            <label for="title">Title:</label>
            <input type="text" id="title">
          </div>
          <div class="form-row">
            <label for="location">Location:</label>
            <input type="text" id="title">
          </div>
          <div class="form-row">
            <label for="year">Year:</label>
            <input type="text" id="title">
          </div>
          <br>
          <input type="submit" value="Submit">
        </form>
      </div>
    </main>
  </div>
</body>
</html>
