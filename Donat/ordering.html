<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ordering Page</title>
</head>
<body>
    <div id="content">
        <header>
            <img class="logo" src="images/CFLogoBlack.png" alt="CF Logo">
            <nav>
                <a href="index.html">Home</a>
                <a href="flavors.html">Flavors</a>
                <a href="ordering.html">Ordering</a>
            </nav>
        </header>
        <section id="decor-cookies">
            <img id="almond-joy" src="images/AlmondJoy NO Background.png" alt="Almond Joy">
            <img id="chocolate-peppermint" src="images/ChocolatePeppermint NO Background.png" alt="Chocolate Peppermint">
            <img id="oatmeal-chip" src="images/OatmealChocolateChip NO Background.png" alt="Oatmeal Chocolate Chip">
            <img id="salted-chip" src="images/SaltedChocolateChip NO Background.png" alt="Salted Chocolate Chip">
        </section>
        <section id="ordering-form">
            <form>
                <label for="am-want">Amount of Cookies Wanted</label><br>
                    <input type="text" id="am-want" name="am-want"><br>
                <label for="fl-want">Flavors Wanted</label><br>
                    <input type="text" id="fl-want" name="fl-want"><br>
                <label for="address">Address for delivery</label><br>
                    <input type="text" id="address" name="address"><br>
                <input type="submit" value="Complete Order">
            </form>
        </section>
        <footer>
            <p>Contact Us</p>
            <div class="social">
                <a href="https://www.facebook.com/thecookiefriday/" target="_blank">
                    <img src="images/facebook.png" alt="fb icon">
                    </a>
                <a href="https://www.instagram.com/cookiefriday/" target="_blank">
                    <img src="images/instagram.png" alt="instagram icon">
                </a>
            </div>
        </footer>
    </div>
</body>
</html>
