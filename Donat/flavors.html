<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Flavors Page</title>
</head>
<body>
    <div id="content">
        <header>
            <img class="logo" src="images/CFLogoBlack.png" alt="CF Logo">
            <nav>
                <a href="index.html">Home</a>
                <a href="flavors.html">Flavors</a>
                <a href="ordering.html">Ordering</a>
            </nav>
        </header>
        <section id="cookie-list">
            <div id="cherry">
                <img id="cherry-image" src="images/CherryOnTopCookie.png" alt="Cherry On Top Cookie">
                <h2>Cherry on Top Cookie</h2>
            </div>
            <div id="choc-chip">
                <img id="choc-chip-image" src="images/ChocolateChipCookie.png" alt="Chocolate Chip Cookie">
                <h2>Choclate Chip Cookie</h2>
            </div>
            <div id="peppermint">
                <img id="peppermint-image" src="images/ChocolatePeppermintCookie.png" alt="Chocolate Peppermint Cookie">
                <h2>Chocolate Peppermint Cookie</h2>
            </div>
            <div id="churro">
                <img id="churro-image" src="images/ChurroCookie.png" alt="Churro Cookie">
                <h2>Churro Cookie</h2>
            </div>
            <div id="coconut-lime">
                <img id="coconut-lime-image" src="images/CoconutLimeCookie.png" alt="Coconut Lime Cookie">
                <h2>Coconut Lime Cookie</h2>
            </div>
            <div id="cookies-n-cream">
                <img id="cookies-n-cream-image" src="images/Cookies'nCreamCookie.png" alt="Cookies and Cream Cookie">
                <h2>Cookies and Cream Cookie</h2>
            </div>
            <div id="mint-brownie">
                <img id="mint-brownie-image" src="images/MintBrownieCookie.png" alt="Mint Brownie Cookie">
                <h2>Mint Brownie Cookie</h2>
            </div>
            <div id="smores">
                <img id="smores-image" src="images/S'moresCookie.png" alt="S'mores Cookie">
                <h2>S'mores Cookie</h2>
            </div>
        </section>
        <footer>
            <p>Contact Us</p>
            <div class="social">
                <a href="https://www.facebook.com/thecookiefriday/" target="_blank">
                    <img src="images/facebook.png" alt="fb icon">
                    </a>
                <a href="https://www.instagram.com/cookiefriday/" target="_blank">
                    <img src="images/instagram.png" alt="instagram icon">
                </a>
            </div>
        </footer>
    </div>
</body>
</html>
